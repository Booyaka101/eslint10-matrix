name: nightly matrix

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/runner/**'
      - 'site/**'
      - '.github/workflows/nightly.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-matrix
  cancel-in-progress: false

jobs:
  shard:
    name: shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Both packages: the runner imports the CLI's verdict and namespace helpers.
      - run: npm run build

      - name: Execute plugins against ESLint 9 and 10
        run: node packages/runner/dist/run.js --shard ${{ matrix.shard }}/4 --concurrency 4 --out shards/shard-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: shards/shard-${{ matrix.shard }}.json
          retention-days: 7

  merge:
    name: merge and publish
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          path: shards
          pattern: shard-*
          merge-multiple: true

      - name: Merge shards into matrix.json
        run: node scripts/merge-shards.mjs shards matrix.json

      # Before the deploy below replaces it. Afterwards the drift guard would be
      # diffing this build against itself and never see a thing, and the site
      # would have nothing to say about what moved.
      - name: Keep the board this run replaces
        run: |
          npm run build --workspace packages/cli
          node scripts/fetch-published.mjs published-matrix.json

      - name: Build the static site
        run: node site/build.mjs --in matrix.json --out site/dist --since published-matrix.json

      - uses: actions/upload-artifact@v7
        with:
          name: published-matrix
          path: published-matrix.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit matrix.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matrix.json
          if git diff --staged --quiet; then
            echo "matrix unchanged"
          else
            git commit -m "chore: nightly matrix $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Keep the merged board for the guards
        uses: actions/upload-artifact@v7
        with:
          name: matrix
          path: matrix.json
          retention-days: 7

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          # site/build.mjs writes .nojekyll, and v4 stopped packing dotfiles.
          include-hidden-files: true

  # Reads the artifact rather than the commit: merge pushes to main, and a guard
  # that checked out main would race that push.
  harness-guard:
    name: harness guard
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: matrix

      - name: Fail if any row was measured with a broken environment
        run: node scripts/check-harness.mjs matrix.json

  # Advisory, like the harness guard. It turns the run red and says why, but it does
  # not gate the deploy: a guard that blocked publishing would leave main ahead of
  # Pages, and every following night would re-diff the fresh board against the same
  # stale one and fail again until somebody intervened.
  drift-guard:
    name: drift guard
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The guard reads the CLI's diff, so the CLI has to be compiled first.
      - run: npm run build --workspace packages/cli

      - uses: actions/download-artifact@v8
        with:
          name: matrix

      # Absent when Pages had nothing to serve, or was unreachable at capture time.
      # check-drift.mjs reads that as no baseline and skips.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: published-matrix

      - name: Fail if a verdict moved unexplained, or a row left the board
        run: node scripts/check-drift.mjs matrix.json published-matrix.json

  deploy:
    name: deploy pages
    needs: merge
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
